[project]
name = "data-engineer-tech-assessment"
version = "0.1.0"
description = "Statera Energy data engineer technical assessment"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "jupyter>=1.0",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
